openapi: 3.0.3
info:
  title: Intelligent Book Management API
  version: 1.0.0
  description: |
    OpenAPI specification for the Intelligent Book Management System.
    Includes authentication, book management, reviews, analysis and recommendations.
servers:
  - url: /
    description: Local server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSignup:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
    BookMetadata:
      type: object
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: string
        published_date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
    Book:
      allOf:
        - $ref: '#/components/schemas/BookMetadata'
        - type: object
          properties:
            id:
              type: string
            filename:
              type: string
            upload_date:
              type: string
              format: date-time
            summary_status:
              type: string
              description: 'pending | in_progress | ready'
    BookList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    ReviewCreate:
      type: object
      required: [rating, text]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
    Review:
      type: object
      properties:
        id:
          type: string
        book_id:
          type: string
        user_id:
          type: string
        rating:
          type: integer
        text:
          type: string
        sentiment:
          type: string
          description: positive|neutral|negative
        created_at:
          type: string
          format: date-time
    Analysis:
      type: object
      properties:
        book_id:
          type: string
        generated_summary:
          type: string
        sentiment_overview:
          type: object
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer
        topics:
          type: array
          items:
            type: string
    Recommendation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        score:
          type: number
          format: float
    Error:
      type: object
      properties:
        detail:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token issued at login (can be sent via cookie)
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: Single-use password reset token
        new_password:
          type: string
          format: password
    MeResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        is_superuser:
          type: boolean
        email_verified:
          type: boolean
paths:
  /auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignup'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Return JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books:
    post:
      summary: Upload book file & metadata. Triggers async summary.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  description: JSON string with book metadata (title, authors, etc.)
      responses:
        '202':
          description: Accepted for processing (async summary started)
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  book_id:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List books (pagination required)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update book details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookMetadata'
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove book and associated file
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Book deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}/borrow:
    post:
      summary: User borrows a book
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Borrow recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: string
                  user_id:
                    type: string
                  due_date:
                    type: string
                    format: date
        '400':
          description: Bad request or not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}/return:
    post:
      summary: User returns a book
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Return processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: string
                  user_id:
                    type: string
                  returned_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}/reviews:
    post:
      summary: Submit review. Triggers async sentiment analysis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '202':
          description: Review accepted; sentiment analysis queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  review_id:
                    type: string
                  status:
                    type: string
                    example: queued
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}/analysis:
    get:
      summary: Get GenAI-aggregated summary of all reviews
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recommendations:
    get:
      summary: Get ML-based suggestions for the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Recommendations for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []

  /auth/refresh:
    post:
      summary: Rotate refresh token and return new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Revoke refresh token / logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Successfully logged out (refresh token revoked)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/request:
    post:
      summary: Request a password reset email (sends single-use token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: If the email exists, a reset link/token will be sent
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset using single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
